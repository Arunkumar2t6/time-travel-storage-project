services:
  - type: web
    name: time-travel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: "us-east-2"
      - key: S3_BUCKET_NAME
        value: "time-travel-blocks"
      - key: CHUNK_SIZE_BYTES
        value: "262144"
      - key: CORS_ORIGINS
        sync: false
      - key: USE_LOCAL_STORAGE
        value: "false"
